name: 抓妖币扫描

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时跑一次
  workflow_dispatch:          # 手动触发

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run scanner
        run: python scanner.py

      - name: Commit report
        run: |
          git config user.name "yaobi-bot"
          git config user.email "bot@yaobi.local"
          git add report.csv
          git diff --staged --quiet || git commit -m "📊 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
